<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northstar IT Service Desk</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f0f2f5;
    --ink: #1b1f24;
    --ink-soft: #5a6472;
    --line: #dfe3e8;
    --accent: #2f6feb;
    --accent-soft: #e7efff;
    --tool: #6b4ea8;
    --tool-soft: #f0eaff;
    --ok: #1a7f52;
    --ok-soft: #e4f5ec;
    --err: #b3261e;
    --err-soft: #fdeceb;
    --warn: #8a5a00;
    --warn-soft: #fdf3e0;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --panel: #1c2027;
      --panel-2: #23272f;
      --ink: #e8eaed;
      --ink-soft: #9aa3b0;
      --line: #2e343d;
      --accent: #6b9bff;
      --accent-soft: #1e2a44;
      --tool: #b79dff;
      --tool-soft: #292142;
      --ok: #5cd39a;
      --ok-soft: #14301f;
      --err: #ff8a80;
      --err-soft: #3a1f1d;
      --warn: #f0c27a;
      --warn-soft: #362a14;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
  .brand span { color: var(--ink-soft); font-weight: 400; }
  .meta { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tag {
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .tag b { color: var(--ink); font-weight: 600; }
  button {
    font: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .wrap { width: 100%; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .empty {
    color: var(--ink-soft);
    text-align: center;
    padding: 40px 16px;
  }
  .empty h2 { color: var(--ink); font-size: 17px; margin: 0 0 6px; }
  .samples { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; align-items: stretch; }
  .samples button { text-align: left; padding: 10px 14px; background: var(--panel); }

  .msg { display: flex; flex-direction: column; gap: 8px; }
  .msg.user { align-items: flex-end; }
  .bubble {
    max-width: 88%;
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .user .bubble { background: var(--accent-soft); border: 1px solid var(--line); border-bottom-right-radius: 4px; }
  .agent .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .who { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }

  .trace { max-width: 88%; display: flex; flex-direction: column; gap: 6px; }
  details.tool {
    background: var(--tool-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  details.tool.is-error { background: var(--err-soft); }
  details.tool > summary {
    cursor: pointer;
    padding: 8px 12px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--tool);
    display: flex;
    align-items: center;
    gap: 8px;
    list-style: none;
  }
  details.tool.is-error > summary { color: var(--err); }
  details.tool > summary::-webkit-details-marker { display: none; }
  details.tool > summary::before { content: "▸"; font-size: 10px; }
  details.tool[open] > summary::before { content: "▾"; }
  .badge {
    margin-left: auto;
    font-size: 10.5px;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--ok-soft);
    color: var(--ok);
    font-family: system-ui, sans-serif;
    font-weight: 600;
  }
  .badge.err { background: var(--err-soft); color: var(--err); }
  .badge.empty-res { background: var(--warn-soft); color: var(--warn); }
  .io { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .io h4 {
    margin: 0;
    font-size: 11px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  pre {
    margin: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 11px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    overflow-x: auto;
    max-height: 320px;
  }

  .note {
    align-self: flex-start;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: var(--panel-2);
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .note.err { color: var(--err); border-color: var(--err); background: var(--err-soft); border-style: solid; }
  .note.await { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }

  footer {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 12px 20px;
  }
  form { width: 100%; max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    min-height: 44px;
    max-height: 160px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  form button[type=submit] { background: var(--accent); color: #fff; border-color: var(--accent); height: 44px; padding: 0 18px; font-weight: 600; }
  form button[type=submit]:hover { opacity: .9; color: #fff; }
  .hint { max-width: 820px; margin: 8px auto 0; font-size: 11.5px; color: var(--ink-soft); font-family: var(--mono); }

  .dots span { animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25 } 30% { opacity: 1 } }

  @media (max-width: 640px) {
    header { padding: 10px 16px; }
    main { padding: 16px; }
    footer { padding: 10px 16px; }
    .bubble, .trace { max-width: 100%; }
    .meta { width: 100%; margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">Northstar IT Service Desk <span>· trợ lý nội bộ</span></div>
  <div class="meta">
    <span class="tag" id="tag-version">artifact <b>…</b></span>
    <span class="tag" id="tag-model">model <b>…</b></span>
    <span class="tag" id="tag-turns">turn <b>0</b></span>
    <button id="btn-reset" type="button">Phiên mới</button>
  </div>
</header>

<main id="main">
  <div class="wrap" id="feed">
    <div class="empty" id="empty">
      <h2>Chưa có hội thoại nào</h2>
      <div>Mỗi lượt sẽ hiện đầy đủ tool được gọi, tham số đầu vào và kết quả hoặc lỗi trả về.</div>
      <div class="samples">
        <button type="button" data-q="VPN production có đang gặp sự cố không?">VPN production có đang gặp sự cố không?</button>
        <button type="button" data-q="Kiểm tra Wi-Fi trên laptop của mình.">Kiểm tra Wi-Fi trên laptop của mình. <em>(thiếu mã máy → agent phải hỏi lại)</em></button>
        <button type="button" data-q="Tạo ticket cho lỗi VPN trên LT-318, mức high.">Tạo ticket cho lỗi VPN trên LT-318, mức high. <em>(phải xin xác nhận trước)</em></button>
      </div>
    </div>
  </div>
</main>

<footer>
  <form id="form">
    <textarea id="input" placeholder="Nhập yêu cầu… (Enter để gửi, Shift+Enter xuống dòng)" rows="1" autofocus></textarea>
    <button type="submit" id="send">Gửi</button>
  </form>
  <div class="hint" id="hint">transcript: …</div>
</footer>

<script>
const feed = document.getElementById('feed');
const main = document.getElementById('main');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const empty = document.getElementById('empty');
let busy = false;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function scroll() { main.scrollTop = main.scrollHeight; }

function addMsg(who, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.innerHTML = `<div class="who">${who === 'user' ? 'Bạn' : 'Trợ lý'}</div>
                  <div class="bubble">${esc(text)}</div>`;
  feed.appendChild(el);
  scroll();
  return el;
}

function addNote(text, kind) {
  const el = document.createElement('div');
  el.className = 'note' + (kind ? ' ' + kind : '');
  el.textContent = text;
  feed.appendChild(el);
  scroll();
  return el;
}

// Một tool event được coi là lỗi khi result có khoá `error`.
// Kết quả rỗng (results: []) được đánh dấu riêng: route đúng nhưng không trả về gì.
function classify(result) {
  if (result && typeof result === 'object') {
    if ('error' in result) return { cls: 'err', label: result.error };
    if (Array.isArray(result.results) && result.results.length === 0) {
      return { cls: 'empty-res', label: 'không có kết quả' };
    }
    if (result.awaiting_user) return { cls: 'empty-res', label: 'chờ người dùng' };
    if (result.status) return { cls: result.status === 'created' ? '' : 'empty-res', label: result.status };
  }
  return { cls: '', label: 'ok' };
}

function addTrace(events) {
  if (!events || !events.length) return;
  const box = document.createElement('div');
  box.className = 'trace';
  for (const ev of events) {
    const info = classify(ev.result);
    const d = document.createElement('details');
    d.className = 'tool' + (info.cls === 'err' ? ' is-error' : '');
    d.innerHTML = `
      <summary>${esc(ev.tool)}()<span class="badge ${info.cls}">${esc(info.label)}</span></summary>
      <div class="io">
        <h4>Input</h4>
        <pre>${esc(JSON.stringify(ev.args, null, 2))}</pre>
        <h4>${info.cls === 'err' ? 'Lỗi trả về' : 'Kết quả'}</h4>
        <pre>${esc(JSON.stringify(ev.result, null, 2))}</pre>
      </div>`;
    if (info.cls === 'err') d.open = true;
    box.appendChild(d);
  }
  feed.appendChild(box);
  scroll();
}

async function send(text) {
  if (busy || !text.trim()) return;
  busy = true;
  sendBtn.disabled = true;
  if (empty) empty.remove();

  addMsg('user', text);
  const pending = addNote('đang xử lý…', null);
  pending.innerHTML = 'đang xử lý<span class="dots"><span>.</span><span>.</span><span>.</span></span>';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    pending.remove();

    if (data.error) {
      addNote('Lỗi provider — ' + data.error, 'err');
    } else {
      addTrace(data.tool_events);
      addMsg('agent', data.assistant_text || '(không có nội dung trả lời)');
      if (data.status === 'waiting_for_user') {
        addNote('Agent đang chờ bạn bổ sung thông tin trước khi tiếp tục.', 'await');
      } else if (data.status === 'max_tool_rounds') {
        addNote('Dừng vì chạm giới hạn số vòng gọi tool.', 'err');
      }
      document.querySelector('#tag-turns b').textContent = data.turn_index;
      document.getElementById('hint').textContent = 'transcript: ' + data.transcript_path;
    }
  } catch (e) {
    pending.remove();
    addNote('Không gọi được server: ' + e.message, 'err');
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const t = input.value;
  input.value = '';
  input.style.height = 'auto';
  send(t);
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-q]');
  if (b) send(b.dataset.q);
});

document.getElementById('btn-reset').addEventListener('click', async () => {
  if (busy) return;
  await fetch('/api/reset', { method: 'POST' });
  feed.innerHTML = '';
  document.querySelector('#tag-turns b').textContent = '0';
  loadInfo();
});

async function loadInfo() {
  const r = await fetch('/api/info');
  const d = await r.json();
  document.querySelector('#tag-version b').textContent = d.artifact_version;
  document.querySelector('#tag-model b').textContent = d.model;
  document.getElementById('hint').textContent = 'transcript: ' + d.transcript_path;
  document.title = 'Northstar IT Service Desk · ' + d.artifact_version;
}
loadInfo();
</script>
</body>
</html>
